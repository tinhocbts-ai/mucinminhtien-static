<!-- partials/header.html — nhung san vao moi trang luc build (build.js). Sua o day roi chay: node build.js -->
<header class="site-header">
  <div class="container header-inner">
    <a href="index.html" data-href="index.html" class="logo">
      <svg class="logo-icon" width="42" height="42" viewBox="0 0 40 40" aria-hidden="true">
        <rect x="2" y="2" width="36" height="36" rx="11" fill="url(#lgGrad)"/>
        <rect x="12.5" y="10" width="15" height="7" rx="1.4" fill="#fff"/>
        <rect x="10" y="16" width="20" height="8" rx="1.6" fill="#fff" fill-opacity=".92"/>
        <rect x="13" y="23.5" width="14" height="8.5" rx="1.2" fill="#fff"/>
        <circle cx="25.5" cy="20" r="1.3" fill="#0b5fae"/>
        <defs>
          <linearGradient id="lgGrad" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
            <stop stop-color="#ff7a30"/>
            <stop offset="1" stop-color="#0b5fae"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="logo-text">
        <span><span class="logo-text-1">Mực In</span> <span class="logo-text-2">Minh Tiến</span></span>
        <small>Hộp mực · Drum · Sửa máy in</small>
      </span>
    </a>

    <button type="button" class="nav-toggle" id="navToggle" aria-expanded="false" aria-controls="mainNav" aria-label="Mở menu">
      <span></span><span></span><span></span>
    </button>

    <nav class="main-nav" id="mainNav" aria-label="Menu chính">
      <ul>
        <li><a href="index.html" data-href="index.html">Trang chủ</a></li>
        <li><a href="san-pham/" data-href="san-pham/">Sản phẩm</a></li>
        <li><a href="nap-muc-may-in-tan-noi-tphcm/" data-href="nap-muc-may-in-tan-noi-tphcm/">Nạp mực tận nơi</a></li>
        <li><a href="bang-gia/" data-href="bang-gia/">Bảng giá</a></li>
        <li><a href="dich-vu/" data-href="dich-vu/">Dịch vụ</a></li>
        <li><a href="huong-dan/" data-href="huong-dan/">Hướng dẫn</a></li>
        <li><a href="gioi-thieu/" data-href="gioi-thieu/">Giới thiệu</a></li>
        <li><a href="lien-he/" data-href="lien-he/">Liên hệ</a></li>
      </ul>
      <a href="tel:{{hotlineTel}}" class="hotline-btn hotline-btn-mobile">📞 Gọi {{hotlineDisplay}}</a>
    </nav>

    <a href="tel:{{hotlineTel}}" class="hotline-btn hotline-btn-desktop">📞 {{hotlineDisplay}}</a>
  </div>
</header>
