<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Không tìm thấy trang — Mực In Minh Tiến</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<style>
  body{font-family:'Segoe UI',Roboto,Arial,sans-serif;color:#1c2733;background:#f5f8fc;margin:0;
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .box{background:#fff;border:1px solid #e3e9f0;border-radius:16px;padding:40px 34px;max-width:520px;
       text-align:center;box-shadow:0 14px 34px rgba(15,45,90,.12)}
  h1{color:#0b5fae;margin:0 0 10px;font-size:1.6rem}
  p{color:#56626e;line-height:1.65}
  a.btn{display:inline-block;margin-top:14px;background:#ff7a30;color:#fff;font-weight:700;
        padding:12px 26px;border-radius:999px;text-decoration:none}
  a{color:#0b5fae}
</style>
<script>
/* Do URL cu tu WordPress: tu dong chuyen ve trang moi tuong ung.
   Chay duoc ca tren github.io (co sub-path) lan ten mien chinh. */
(function () {
  var SUB = '/mucinminhtien-static';
  var base = location.hostname.indexOf('github.io') > -1 ? SUB + '/' : '/';
  var path = location.pathname;
  if (base !== '/' && path.indexOf(SUB) === 0) path = path.slice(SUB.length);
  var slugs = {{slugs404}};
  var dest = null;
  var m = path.match(/^\/product\/([^\/]+)/);
  if (m) dest = slugs.indexOf(m[1]) > -1 ? 'san-pham/' + m[1] + '/' : 'san-pham/';
  else if (/^\/product-category\//.test(path)) dest = 'san-pham/';
  else if (/^\/(category|tag|author|20\d\d)\//.test(path)) dest = 'huong-dan/';
  else if (/^\/(cart|checkout|my-account|shop)\//.test(path)) dest = 'san-pham/';
  if (dest !== null) location.replace(base + dest);
})();
</script>
</head>
<body>
  <div class="box">
    <h1>Không tìm thấy trang</h1>
    <p>Trang bạn tìm có thể đã được chuyển sang địa chỉ mới trên website mới của Mực In Minh Tiến.</p>
    <p><a href="/">← Về trang chủ</a> · <a href="/san-pham/">Sản phẩm</a> · <a href="/bang-gia/">Bảng giá</a></p>
    <a class="btn" href="tel:{{hotlineTel}}">📞 Gọi {{hotlineDisplay}}</a>
  </div>
</body>
</html>
